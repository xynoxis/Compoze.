spring:
  application:
    name: blog-backend

  datasource:
    url: jdbc:postgresql://${DATABASE_PGHOST}/${DATABASE_PGDATABASE}?sslmode=require
    username: ${DATABASE_PGUSER}
    password: ${DATABASE_PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}

  cors:
    allowed-origin: ${CORS_ORIGIN:https://compoze-one.vercel.app}
