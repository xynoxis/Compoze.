spring:
  application:
    name: blog-backend

  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/blog}
    username: ${DATABASE_USERNAME:blog}
    password: ${DATABASE_PASSWORD:blog_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-for-local-development-only-32bytes-minimum}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}

  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:3000} 
