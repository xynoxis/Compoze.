services:
  postgres:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U blog -d blog" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
